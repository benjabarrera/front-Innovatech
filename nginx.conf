server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Reverse proxy hacia el backend de Ventas ----
    # Apuntamos directamente a la IP privada de la nueva instancia Backend
    location /api/v1/ventas {
        proxy_pass http://172.31.15.232:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Reverse proxy hacia el backend de Despachos ----
    # Apuntamos directamente a la IP privada de la nueva instancia Backend
    location /api/v1/despachos {
        proxy_pass http://172.31.15.232:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- SPA de React ----
    # Cualquier ruta que no sea un archivo real devuelve index.html
    # para que React Router maneje la navegacion en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
